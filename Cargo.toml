[workspace]
resolver = "2"
members = [
    "crates/dtp-codec",
    "crates/devtape-scrub",
    "crates/devtape-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zstd = "0.13"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
