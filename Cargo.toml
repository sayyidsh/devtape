[workspace]
resolver = "2"
exclude = ["bindings/python"]
members = [
    "crates/dtp-codec",
    "crates/devtape-scrub",
    "crates/devtape-pty",
    "crates/devtape-git",
    "crates/devtape-core",
    "crates/devtape-cli",
    "crates/devtape-mcp",
    "crates/devtape-net",
    "crates/devtape-ui",
    "crates/dtp-wasm",
]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/sayyidsh/devtape"
homepage = "https://sayyidsh.github.io/devtape/"
readme = "README.md"
keywords = ["terminal", "replay", "pty", "mcp", "debugging"]
categories = ["command-line-utilities", "development-tools::debugging"]

[workspace.dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
portable-pty = "0.8"
regex = "1.11"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "macros", "time", "io-util", "net"] }
zstd = "0.13"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
