[package]
name = "devtape-cli"
description = "Reference CLI for the DevTape Protocol (DTP v0.1) — record, scrub, rewind, and inspect terminal & AI-agent sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "devtape"
path = "src/main.rs"

[dependencies]
clap.workspace = true
devtape-ui = { version = "0.4.3", path = "../devtape-ui" }
devtape-net = { version = "0.4.3", path = "../devtape-net" }
devtape-mcp = { version = "0.4.3", path = "../devtape-mcp" }
devtape-pty = { version = "0.4.3", path = "../devtape-pty" }
devtape-core = { version = "0.4.3", path = "../devtape-core" }
devtape-git = { version = "0.4.3", path = "../devtape-git" }
devtape-scrub = { version = "0.4.3", path = "../devtape-scrub" }
dtp-codec = { version = "0.4.3", path = "../dtp-codec" }
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
portable-pty.workspace = true
tempfile = "3"
