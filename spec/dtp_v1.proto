syntax = "proto3";

package dtp.v1;

// Hybrid Logical Clock for causal ordering across concurrent local producers.
message HybridLogicalClock {
  uint64 physical_ms = 1;
  uint32 logical = 2;
  uint32 node_id = 3;
}

enum QosMode {
  QOS_MODE_UNSPECIFIED = 0;
  QOS_MODE_ZERO_STALL = 1; // QoS-0: never block interactive PTY; emit DropMarker on burst.
  QOS_MODE_LOSSLESS = 2;   // QoS-1: guaranteed capture for CI and auditing.
}

enum ExportProfile {
  EXPORT_PROFILE_UNSPECIFIED = 0;
  EXPORT_PROFILE_FULL = 1;
  EXPORT_PROFILE_DIFF_ONLY = 2;
  EXPORT_PROFILE_TRACE_ONLY = 3;
}

enum StreamChannel {
  STREAM_CHANNEL_UNSPECIFIED = 0;
  STREAM_CHANNEL_STDIN = 1;
  STREAM_CHANNEL_STDOUT = 2;
  STREAM_CHANNEL_STDERR = 3;
}

message RedactionAttestation {
  string ruleset_version = 1;
  uint64 redacted_count = 2;
  bool local_map_excluded = 3; // MUST be true for any exported .tape file.
}

message TapeManifest {
  string spec_version = 1;     // e.g. "0.1.0"
  string session_id = 2;
  string os = 3;
  string arch = 4;
  string shell = 5;
  QosMode qos_mode = 6;
  ExportProfile export_profile = 7;
  repeated string extensions = 8;
  RedactionAttestation redaction = 9;
  string integrity_blake3 = 10;
}

message SessionStart {
  string sanitized_cwd = 1;
  string env_fingerprint = 2;
}

message SpanStart {
  string kind = 1;  // "command", "agent_tool", "http_tx"
  string label = 2; // Scrubbed command line or tool name
}

message SpanEnd {
  int32 exit_code = 1;
  uint64 duration_ms = 2;
}

message StreamChunk {
  StreamChannel channel = 1;
  bytes data = 2; // Scrubbed UTF-8 or raw terminal bytes
}

message StateSnapshot {
  string tree_blake3 = 1;
  uint32 changed_files = 2;
}

message DropMarker {
  uint64 bytes_dropped = 1;
  string reason = 2;
}

message SessionEnd {
  uint64 total_events = 1;
  uint64 duration_ms = 2;
}

// Forward-compatible extension payload preserved by older readers.
message ExtensionPayload {
  string extension_id = 1; // e.g. "ext.mcp.v1"
  string event_name = 2;
  bytes payload = 3;
}

message EventEnvelope {
  uint64 seq = 1;
  HybridLogicalClock hlc = 2;
  string span_id = 3;
  string parent_span_id = 4;

  oneof body {
    SessionStart session_start = 10;
    SpanStart span_start = 11;
    SpanEnd span_end = 12;
    StreamChunk stream_chunk = 13;
    StateSnapshot state_snapshot = 14;
    DropMarker drop_marker = 15;
    SessionEnd session_end = 16;
    ExtensionPayload extension = 99;
  }
}
