name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      npm_version:
        description: Existing GitHub release version to publish to npm, without the v prefix
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build (${{ matrix.target }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin: devtape
            asset: devtape-x86_64-unknown-linux-gnu.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bin: devtape
            asset: devtape-aarch64-apple-darwin.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            bin: devtape
            asset: devtape-x86_64-apple-darwin.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: devtape.exe
            asset: devtape-x86_64-pc-windows-msvc.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run workspace test suite
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Build stripped release binary
        run: cargo build --locked --release -p devtape-cli --target ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enforce the stripped CLI size budget
        run: node scripts/check-release-size.mjs "target/${{ matrix.target }}/release/${{ matrix.bin }}"

      - name: Package release binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf "${{ matrix.asset }}" -C "target/${{ matrix.target }}/release" "${{ matrix.bin }}"
          shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"

      - name: Package release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/${{ matrix.bin }}"
          Compress-Archive -Path $bin -DestinationPath "${{ matrix.asset }}"
          $hash = (Get-FileHash "${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset }}" | Out-File -Encoding ascii "${{ matrix.asset }}.sha256"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release and attach binaries
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*

  publish-crates:
    name: Publish Workspace Crates (crates.io)
    needs: [publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check workspace package contents and verify the codec package
        run: |
          cargo package --workspace --locked --no-verify
          cargo package --locked -p dtp-codec
      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not configured; skipping live crates.io publish after package verification."
            exit 0
          fi
          crates=(
            dtp-codec devtape-scrub dtp-wasm devtape-git devtape-pty
            devtape-core devtape-mcp devtape-net devtape-ui devtape-cli
          )
          for crate in "${crates[@]}"; do
            echo "Publishing $crate..."
            if output=$(cargo publish --locked -p "$crate" 2>&1); then
              printf '%s\n' "$output"
            elif printf '%s\n' "$output" | grep -qiE 'already (uploaded|exists|published)'; then
              echo "$crate is already published on crates.io; continuing."
            else
              printf '%s\n' "$output" >&2
              exit 1
            fi
          done

  publish-npm:
    name: Publish devtape-dtp-wasm (npm)
    needs: [publish-release]
    if: >-
      ${{ !cancelled() &&
          ((github.event_name == 'push' && needs.publish-release.result == 'success') ||
           (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      CC_wasm32_unknown_unknown: clang
      AR_wasm32_unknown_unknown: llvm-ar
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install -y clang llvm lld
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Check npm retry version
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_VERSION: ${{ inputs.npm_version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./packages/dtp-wasm/package.json").version')
          if [[ "$version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::The checked-out npm package version does not match the requested retry version."
            exit 1
          fi
          gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName
      - name: Build, test conformance, and dry-run pack devtape-dtp-wasm
        run: |
          bash packages/dtp-wasm/build.sh
          node packages/dtp-wasm/test.mjs
          (cd packages/dtp-wasm && npm pack --dry-run)
      - name: Publish devtape-dtp-wasm to npm with provenance
        env:
          NPM_TRUSTED_PUBLISHING: ${{ vars.NPM_TRUSTED_PUBLISHING }}
          NODE_AUTH_TOKEN: ${{ vars.NPM_TRUSTED_PUBLISHING != 'true' && secrets.NPM_TOKEN || '' }}
        run: |
          set -euo pipefail
          if [[ "$NPM_TRUSTED_PUBLISHING" != 'true' && -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "::notice::npm publishing is disabled; package and conformance verification passed."
            exit 0
          fi
          cd packages/dtp-wasm
          npm publish --access public --provenance

  publish-pypi:
    name: Build & Publish devtape-dtp (PyPI)
    needs: [publish-release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel with maturin and verify 16-vector conformance
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install maturin pytest
          .venv/bin/maturin build --release --manifest-path bindings/python/Cargo.toml --out dist-pypi
          .venv/bin/python -m pip install dist-pypi/*.whl
          .venv/bin/pytest bindings/python/tests/test_conformance.py
      - name: Upload verified Python wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-devtape-dtp
          path: dist-pypi/*.whl
      - name: Check PyPI publishing configuration
        id: pypi
        env:
          ENABLE_PYPI_PUBLISH: ${{ vars.ENABLE_PYPI_PUBLISH }}
          PYPI_TRUSTED_PUBLISHING: ${{ vars.PYPI_TRUSTED_PUBLISHING }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [[ "$ENABLE_PYPI_PUBLISH" == 'true' || "$PYPI_TRUSTED_PUBLISHING" == 'true' || -n "$PYPI_API_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::PyPI publishing is disabled; uploaded the verified wheel as a workflow artifact."
          fi
      - name: Publish wheel to PyPI (when enabled)
        if: steps.pypi.outputs.enabled == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi/
          password: ${{ vars.PYPI_TRUSTED_PUBLISHING != 'true' && secrets.PYPI_API_TOKEN || '' }}

  sync-homebrew:
    name: Sync Formula/devtape.rb (Homebrew Tap)
    needs: [publish-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release checksums
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Render Formula/devtape.rb from release digests
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SHA_ARM=$(awk '{print $1}' dist/devtape-aarch64-apple-darwin.tar.gz.sha256)
          SHA_INTEL=$(awk '{print $1}' dist/devtape-x86_64-apple-darwin.tar.gz.sha256)
          SHA_LINUX=$(awk '{print $1}' dist/devtape-x86_64-unknown-linux-gnu.tar.gz.sha256)
          cat > Formula/devtape.rb <<EOF
          class Devtape < Formula
            desc "Record, scrub, rewind, and inspect terminal and AI-agent sessions"
            homepage "https://sayyidsh.github.io/devtape/"
            license "Apache-2.0"

            on_macos do
              on_arm do
                url "https://github.com/sayyidsh/devtape/releases/download/${TAG}/devtape-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM}"
              end
              on_intel do
                url "https://github.com/sayyidsh/devtape/releases/download/${TAG}/devtape-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_INTEL}"
              end
            end

            on_linux do
              on_intel do
                url "https://github.com/sayyidsh/devtape/releases/download/${TAG}/devtape-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX}"
              end
            end

            def install
              bin.install "devtape"
            end

            test do
              system bin/"devtape", "doctor"
            end
          end
          EOF
          cat Formula/devtape.rb
      - name: Upload rendered Formula/devtape.rb artifact
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: Formula/devtape.rb
      - name: Push Formula/devtape.rb to sayyidsh/homebrew-tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not configured; uploaded rendered Formula/devtape.rb as workflow artifact."
            exit 0
          fi
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/sayyidsh/homebrew-tap.git" /tmp/tap
          cp Formula/devtape.rb /tmp/tap/Formula/devtape.rb
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet Formula/devtape.rb; then
            git add Formula/devtape.rb
            git commit -m "feat(devtape): update devtape formula to ${GITHUB_REF_NAME}"
            git push origin main
          fi
