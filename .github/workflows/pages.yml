name: Deploy Viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust with the browser WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install LLVM tools for Zstandard's WASM build
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld

      - name: Install the matching wasm-bindgen binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build and test the real browser decoder bundle
        env:
          CARGO_INCREMENTAL: '0'
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: |
          mkdir -p web/viewer
          cp crates/devtape-ui/index.html web/viewer/index.html
          cargo build --locked --release -p dtp-wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir web/viewer/pkg --out-name dtp_wasm target/wasm32-unknown-unknown/release/dtp_wasm.wasm
          printf '{"type":"module"}\n' > web/viewer/pkg/package.json
          cargo run --locked -p dtp-wasm --example browser_fixture -- target/browser-test.tape
          node scripts/test-wasm.mjs web/viewer/pkg/dtp_wasm.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload web/viewer artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: "web/viewer"

      - name: Wait for the uploaded artifact to appear in the run
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADED_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          for attempt in {1..12}; do
            if artifact_id=$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f "name=$PAGES_ARTIFACT_NAME" \
              --jq 'if .total_count == 1 then .artifacts[0].id else empty end') &&
              [[ -n "$artifact_id" && "$artifact_id" == "$UPLOADED_ARTIFACT_ID" ]]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Artifact $PAGES_ARTIFACT_NAME ($UPLOADED_ARTIFACT_ID) did not appear in the workflow run"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
