name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Exercise the action's report and failure propagation
        run: node --test scripts/action/report.test.mjs

  performance:
    name: Release size and benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enforce the stripped CLI size budget
        run: |
          cargo build --locked --release -p devtape-cli
          node scripts/check-release-size.mjs target/release/devtape
      - name: Measure codec, scrubber, and interactive PTY performance
        shell: bash
        run: |
          {
            echo '### DevTape microbenchmarks'
            echo
            echo '~~~text'
            cargo bench --locked -p dtp-codec --bench codec_bench
            cargo bench --locked -p devtape-scrub --bench scrub_bench
            python3 scripts/bench-pty.py target/release/devtape
            echo '~~~'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Measure steady-state CPU and memory
        shell: bash
        run: |
          {
            echo '### DevTape recorder resource usage'
            echo
            echo '~~~text'
            python3 scripts/bench-resources.py target/release/devtape
            echo '~~~'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify sustained recording and compressed archive size
        shell: bash
        run: |
          {
            echo '### DevTape sustained recording'
            echo
            echo '~~~text'
            python3 scripts/check-sustained-recording.py target/release/devtape
            echo '~~~'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  codec-fuzz:
    name: Codec fuzz smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz tape decoding and ANSI replay
        shell: bash
        run: |
          bash scripts/run-codec-fuzz.sh
          git diff --exit-code -- fuzz/Cargo.lock

  browser-decoder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install -y clang llvm lld
      - run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the browser decoder and dry-run pack devtape-dtp-wasm
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: |
          cargo check --locked -p dtp-wasm --target wasm32-unknown-unknown
          cargo build --locked --release -p dtp-wasm --target wasm32-unknown-unknown
          wasm-bindgen --target web --out-dir web/viewer/pkg --out-name dtp_wasm target/wasm32-unknown-unknown/release/dtp_wasm.wasm
          printf '{"type":"module"}\n' > web/viewer/pkg/package.json
          cargo run --locked -p dtp-wasm --example browser_fixture -- target/browser-test.tape
          node scripts/test-wasm.mjs web/viewer/pkg/dtp_wasm.js
          bash packages/dtp-wasm/build.sh
          node packages/dtp-wasm/test.mjs
          (cd packages/dtp-wasm && npm pack --dry-run)

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install maturin pytest
      - run: .venv/bin/maturin develop --manifest-path bindings/python/Cargo.toml
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv
      - run: .venv/bin/pytest bindings/python/tests/test_conformance.py

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run local DevTape action against a failing command
        id: smoke
        continue-on-error: true
        uses: ./
        with:
          # Keep CI independent of the release that this change may trigger.
          version: v0.3.0
          command: |
            echo "Deploying with token ghp_A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8"
            exit 42
          artifact_name: devtape-smoke-tape
      - name: Verify devtape-ci.tape artifact and redaction
        run: |
          test "${{ steps.smoke.outcome }}" = "failure"
          test "${{ steps.smoke.outputs.exit_code }}" = "42"
          test -s devtape-ci.tape
          devtape inspect devtape-ci.tape | grep -q '"ext.ci.v1"'
          ! devtape inspect devtape-ci.tape | grep -q 'ghp_A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8'
